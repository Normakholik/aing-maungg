<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Buat nopa❤️</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      color: #4a4a4a;
    }

    /* Container Kartu Utam */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 30px 25px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 105, 135, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.6);
      z-index: 10;
      position: relative;
      margin: 20px 0;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #e63946;
      margin-bottom: 10px;
    }

    /* Galeri Foto Memory */
    .photo-gallery {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .photo-card {
      width: 80px;
      height: 100px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
      border: 3px solid #fff;
    }

    .photo-card:nth-child(2) {
      transform: rotate(4deg) scale(1.05);
    }

    .photo-card:nth-child(3) {
      transform: rotate(-2deg);
    }

    .photo-card:hover {
      transform: scale(1.15) rotate(0deg);
      z-index: 5;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Teks Pesan Ketik Auto */
    .typing-box {
      min-height: 70px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #555;
      margin: 15px 0;
      font-style: italic;
    }

    /* Area Tombol Pilihan */
    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      position: relative;
      min-height: 50px;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff4b2b, #ff416c);
      color: white;
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
    }

    .btn-no {
      background: #e0e0e0;
      color: #666;
      position: absolute;
      right: 20px;
    }

    /* Pemutar Musik Floating */
    .music-control {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px 15px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .music-control i {
      color: #ff416c;
      font-size: 1.2rem;
    }

    /* Efek Particles Hati */
    .heart-particle {
      position: absolute;
      color: #ff4b2b;
      opacity: 0.7;
      animation: floatUp 4s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Pop-up Pesan Sukses */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Musik Latar (Ganti URL audio jika punya lagu sendiri) -->
  <audio id="bgMusic" loop src="music.mp4"></audio>

  <!-- Tombol Musik -->
  <div class="music-control" onclick="toggleMusic()">
    <i id="musicIcon" class="fas fa-music"></i>
    <span id="musicText">Putar Musik</span>
  </div>

  <!-- Kartu Utama -->
  <div class="card">
    <h1>Hai Kamu... ❤️</h1>

    <!-- Galeri Foto (Ganti src="..." dengan fotomu/link gambar) -->
    <div class="photo-gallery">
      <div class="photo-card">
        <img src="foto1.jpeg" alt="Foto 1">
      </div>
      <div class="photo-card">
        <img src="foto2.jpeg" alt="Foto 2">
      </div>
      <div class="photo-card">
        <img src="foto3.jpeg" alt="Foto 3">
      </div>
    </div>

    <!-- Area Teks Otomatis Ketik -->
    <div class="typing-box" id="typingText"></div>

    <p style="font-weight: 600; margin-top: 10px;">Aing minta maaf yaakk🥺</p>

    <!-- Tombol Pilihan -->
    <div class="btn-group" id="btnGroup">
      <button class="btn btn-yes" onclick="acceptLove()">Di maafin❤️</button>
      <button class="btn btn-no" id="btnNo" onmouseover="moveNoButton()" onclick="moveNoButton()">GAK!!</button>
    </div>
  </div>

  <!-- Pop-up Jika Mengklik 'Mau!' -->
  <div class="modal" id="successModal">
    <div class="modal-content">
      <h2 style="color: #e63946; font-family: 'Dancing Script', cursive; font-size: 2.2rem;">Yeayy! dimaafin 🥰🎉</h2>
      <p style="margin: 15px 0; color: #555;">Makasih yaa udah mau maafin gue yang suka ngeselin iniii,,, tapi kan aku sayang kamu ❤️✨</p>
      <button class="btn btn-yes" onclick="closeModal()">Sama-sama! 💕</button>
    </div>
  </div>

  <script>
    // 1. Teks Efek Ketik Otomatis
    const message = "Maaff yaa my bondol guehhh udh bikin lu kesel, terus bikin lu nangis juga.... sering bikin badmoodd";
    let i = 0;
    function typeWriter() {
      if (i < message.length) {
        document.getElementById("typingText").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
      }
    }
    window.onload = typeWriter;

    // 2. Tombol 'Enggak' Kabur Saat Diarahkan/Ditekan
    function moveNoButton() {
      const btnNo = document.getElementById("btnNo");
      const btnGroup = document.getElementById("btnGroup");
      
      const groupRect = btnGroup.getBoundingClientRect();
      
      // Hitung posisi acak di sekitar tombol
      const x = Math.random() * (window.innerWidth - 100) - (window.innerWidth / 2) + 50;
      const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2) + 50;
      
      btnNo.style.position = "fixed";
      btnNo.style.left = `calc(50% + ${x}px)`;
      btnNo.style.top = `calc(50% + ${y}px)`;
    }

    // 3. Kontrol Musik
    const audio = document.getElementById("bgMusic");
    const musicIcon = document.getElementById("musicIcon");
    const musicText = document.getElementById("musicText");
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        musicIcon.className = "fas fa-music";
        musicText.innerText = "Putar Musik";
      } else {
        audio.play();
        musicIcon.className = "fas fa-pause";
        musicText.innerText = "Jeda";
      }
      isPlaying = !isPlaying;
    }

    // 4. Aksi Tombol 'Mau!'
    function acceptLove() {
      document.getElementById("successModal").style.display = "flex";
      createConfetti();
    }

    function closeModal() {
      document.getElementById("successModal").style.display = "none";
    }

    // 5. Membuat Efek Hati Melayang di Background
    function createHearts() {
      const heart = document.createElement("div");
      heart.classList.add("heart-particle");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 2 + 3 + "s";
      heart.style.fontSize = Math.random() * 15 + 10 + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
    setInterval(createHearts, 300);
  </script>
</body>
</html>
